name: Scrape LeafLink Sales (All Brands)

on:
  workflow_dispatch:
    inputs:
      incremental_days:
        description: "Days to pull (0 = full backfill from LEAFLINK_FROM_DATE)"
        required: false
        default: '7'
  push:
    branches: [main]
  schedule:
    # Weekly full refresh, so backdated or amended orders outside the
    # incremental window still get corrected. Sundays 09:00 UTC.
    - cron: '0 9 * * 0'

permissions:
  contents: write

concurrency:
  group: scrape-leaflink-mi
  # MUST stay false. With cancel-in-progress: true, any run lasting longer than
  # the 10-minute trigger interval is killed by the next trigger before it can
  # commit - so a slow repo never finishes a run at all, and a push of new code
  # gets cancelled out from under you. Queueing is safe here: GitHub holds at
  # most ONE pending run per group and replaces it, so there is no backlog.
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          LEAFLINK_API_KEY: ${{ secrets.LEAFLINK_API_KEY }}
          LEAFLINK_SELLER_ID: '9105'
          LEAFLINK_BRAND: ''
          # The inventory dashboard only reads order history to derive a SKU's
          # average unit price, units per case and product line - it never charts
          # historical sales. Every one of the 152 catalogue SKUs has sold within
          # the last 6 months, so a 12-month window supplies all of it while
          # cutting the payload from ~153,000 line items to roughly 45,000.
          # Changing this value forces ONE full backfill (small, over the shorter
          # window), then incremental runs resume.
          LEAFLINK_FROM_DATE: '2025-08-01'
          # 'Combined' orders are the originals that LeafLink merged into a
          # replacement order. They still carry their full total, so counting
          # them double-counts that revenue - LeafLink's own order report
          # leaves them out. 'Draft' orders were never placed.
          LEAFLINK_EXCLUDE_STATUSES: 'Cancelled,Rejected,Combined,Draft'
          LEAFLINK_PULL_INVENTORY: '1'
          # Incremental mode: pull only the last N days and merge into the
          # committed file instead of rescanning 2020->today on every run. The
          # scraper still does a full backfill on the first run, or any run where
          # the committed data isn't yet complete back to LEAFLINK_FROM_DATE.
          # Set to '0' (or run the Full refresh workflow) to force a full pull.
          LEAFLINK_INCREMENTAL_DAYS: ${{ github.event_name == 'schedule' && '0' || (github.event.inputs.incremental_days || '7') }}
        run: python scraper.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # sales_data.json.gz is binary and is fully regenerated each run, so it can
          # never be merged — our fresh copy must always win. Sync to the latest remote
          # first, then lay our new file on top and commit. Retry if the remote moves.
          ok=0
          for i in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add sales_data.json.gz
            if git diff --staged --quiet; then
              echo "No data changes to commit."; ok=1; break
            fi
            git commit -m "Auto-update sales_data.json.gz [skip ci]"
            if git push origin main; then ok=1; break; fi
            echo "Push raced with remote (attempt $i) — re-syncing..."; sleep 3
          done
          [ "$ok" = "1" ] || { echo "Could not push after retries"; exit 1; }
